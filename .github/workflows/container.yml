name: Build and smoke a container

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      version:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    outputs:
      digest:
        description: Digest of the tested, published platform image
        value: ${{ jobs.container.outputs.digest }}

env:
  IMAGE: ghcr.io/arminayat/home-assistant-transit-board

jobs:
  container:
    runs-on: ${{ inputs.runner }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the native platform image
        env:
          APP_ARCH: ${{ inputs.arch }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          case "$APP_ARCH" in
            amd64) platform=linux/amd64 ;;
            aarch64) platform=linux/arm64 ;;
            *) echo "Unsupported architecture" >&2; exit 1 ;;
          esac
          docker buildx build --load --platform "$platform" \
            --build-arg "BUILD_ARCH=$APP_ARCH" \
            --build-arg "BUILD_VERSION=$APP_VERSION" \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --tag transit-board:test transit_board
      - name: Verify runtime, ingress restrictions and persisted configuration
        run: bash transit_board/scripts/container-smoke.sh transit-board:test
      - name: Publish the exact tested image
        id: publish
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ARCH: ${{ inputs.arch }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          content_id=$(docker image inspect transit-board:test --format '{{.Id}}')
          remote="$IMAGE:build-$GITHUB_SHA-$APP_ARCH-${content_id#sha256:}"
          docker tag transit-board:test "$remote"
          docker push "$remote"
          digest=$(docker buildx imagetools inspect "$remote" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
