name: Publish app images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact current app manifest version, without a leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/arminayat/home-assistant-transit-board

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  prepare:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Require the requested version to match the manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          MANIFEST_VERSION: ${{ needs.quality.outputs.version }}
        run: |
          expected="$REQUESTED_VERSION"
          if [ "$EVENT_NAME" = push ]; then expected="${expected#v}"; fi
          if [ "$expected" != "$MANIFEST_VERSION" ]; then
            echo "Requested version does not match transit_board/config.yaml" >&2
            exit 1
          fi
  amd64:
    needs: [quality, prepare]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      arch: amd64
      runner: ubuntu-24.04
      version: ${{ needs.quality.outputs.version }}
      publish: true
  aarch64:
    needs: [quality, prepare]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      arch: aarch64
      runner: ubuntu-24.04-arm
      version: ${{ needs.quality.outputs.version }}
      publish: true
  manifest:
    needs: [quality, amd64, aarch64]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish and inspect the multiarchitecture version
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.quality.outputs.version }}
          AMD64_DIGEST: ${{ needs.amd64.outputs.digest }}
          AARCH64_DIGEST: ${{ needs.aarch64.outputs.digest }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Platform pushes have now created and linked even a brand-new package.
          # Fail closed on registry errors; only a missing version may be created.
          if result=$(docker buildx imagetools inspect "$IMAGE:$APP_VERSION" 2>&1); then
            echo "This image version already exists; choose a new version." >&2
            exit 1
          fi
          if ! printf '%s' "$result" | grep -Eqi 'not found|manifest unknown|404'; then
            printf '%s\n' "$result" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=$APP_VERSION" \
            --tag "$IMAGE:$APP_VERSION" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$AARCH64_DIGEST"
          docker buildx imagetools inspect "$IMAGE:$APP_VERSION" --raw > manifest.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const platforms = manifest.manifests.map(({ platform }) => `${platform.os}/${platform.architecture}`).sort();
          if (JSON.stringify(platforms) !== JSON.stringify(['linux/amd64', 'linux/arm64'])) {
            throw new Error(`Unexpected image platforms: ${platforms}`);
          }
          console.log(`Published tested platforms: ${platforms.join(', ')}`);
          JS
